<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ミタニ市長選挙</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #000;
      overflow: hidden;
      font-family: sans-serif;
    }

    .top {
      height: 100vh;
      width: 100vw;
      color: white;
      background: black;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 24px;
      box-sizing: border-box;
    }

    .top h1 {
      font-size: 28px;
      margin-bottom: 20px;
    }

    .top p {
      font-size: 16px;
      line-height: 1.8;
    }

    .start-button {
      margin-top: 32px;
      padding: 14px 36px;
      font-size: 18px;
      border: none;
      border-radius: 999px;
      background: white;
      color: black;
      cursor: pointer;
    }

    .reels-container {
      display: none;
      height: 100vh;
      width: 100vw;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      background: black;
    }

    .reel {
      position: relative;
      height: 100vh;
      width: 100vw;
      scroll-snap-align: start;
      display: flex;
      justify-content: center;
      align-items: center;
      background: black;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: black;
    }

    .like-box {
      position: absolute;
      right: 20px;
      bottom: 120px;
      color: white;
      text-align: center;
      z-index: 100;
      text-shadow: 0 2px 6px rgba(0,0,0,0.8);
      user-select: none;
      pointer-events: none;
    }

    .like-icon {
      font-size: 38px;
      line-height: 1;
    }

    .like-count {
      margin-top: 4px;
      font-size: 16px;
      font-weight: bold;
    }

    .end {
      height: 100vh;
      width: 100vw;
      scroll-snap-align: start;
      color: white;
      background: black;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 24px;
      text-align: center;
      line-height: 1.8;
      padding: 30px;
      box-sizing: border-box;
    }
  </style>
</head>

<body>

  <div class="top" id="top">
    <h1>ViewTube</h1>
    <p>
      ショート動画を視聴できます。<br>
      音量をあげて上にスワイプしてください。
    </p>
    <button class="start-button" onclick="startVideos()">スタート</button>
  </div>

  <div class="reels-container" id="reels"></div>

  <script>
    const sequenceVideos = [
      {
        src: "フェイク動画_真相ハンターＫ01.mp4",
        likes: "3.8K"
      },
      {
        src: "フェイク動画_真相ハンターＫ02.mp4",
        likes: "5.1K"
      },
        src: "フェイク動画_真相ハンターＫ03.mp4",
        likes: "4.6K"
      },
        src: "フェイク動画_真相ハンターＫ04.mp4",
        likes: "10.2K"
      }
    ];

    sequenceVideos.forEach(video => {
      const minPos = previousIndex + 1;
      const maxPos = videos.length;
      const insertPos = Math.floor(Math.random() * (maxPos - minPos + 1)) + minPos;

      videos.splice(insertPos, 0, video);
      previousIndex = insertPos;
    });

    const reels = document.getElementById("reels");

    videos.forEach((item) => {
      const section = document.createElement("section");
      section.className = "reel";

      const video = document.createElement("video");
      video.src = item.src;
      video.controls = true;
      video.playsInline = true;
      video.muted = false;
      video.volume = 1.0;
      video.preload = "metadata";

      const likeBox = document.createElement("div");
      likeBox.className = "like-box";
      likeBox.innerHTML =
        '<div class="like-icon">♡</div>' +
        '<div class="like-count">' + item.likes + '</div>';

      section.appendChild(video);
      section.appendChild(likeBox);
      reels.appendChild(section);
    });

    const end = document.createElement("section");
    end.className = "end";
    end.innerHTML = "もう一度、ご覧になる場合はスワイプしてください。";
    reels.appendChild(end);

    function startVideos() {
      document.getElementById("top").style.display = "none";
      reels.style.display = "block";

      const firstVideo = document.querySelector("video");
      firstVideo.play().catch(() => {});
    }

    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        const video = entry.target.querySelector("video");
        if (!video) return;

        if (entry.isIntersecting) {
          video.play().catch(() => {});
        } else {
          video.pause();
          video.currentTime = 0;
        }
      });
    }, {
      threshold: 0.7
    });

    document.querySelectorAll(".reel").forEach(reel => {
      observer.observe(reel);
    });
  </script>

</body>
</html>
